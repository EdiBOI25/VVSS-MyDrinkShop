# Define the default driver
#webdriver.driver=phantomjs

# Appears at the top of the reports
serenity.project.name = Lab 5 carturesti.ro Teste

webdriver.autodownload = false
webdriver.driver = firefox
headless.mode = false

webdriver.firefox.driver = ${user.dir}/src/test/resources/linux/geckodriver
webdriver.gecko.driver = ${user.dir}/src/test/resources/linux/geckodriver
webdriver.chrome.driver = ${user.dir}/src/test/resources/linux/chromedriver
#webdriver.firefox.driver = src/test/resources/windows/geckodriver.exe
#webdriver.gecko.driver = src/test/resources/windows/geckodriver.exe
#webdriver.chrome.driver = src/test/resources/windows/chromedriver.exe
# Pentru Firefox se descarca ultima versiune geckodriver.
# Pentru Chrome se verifica daca ultima versiune (sau cea stabila) a chromedriver este buna. Altfel, se foloseste o versiune anterioara.

# Root package for any JUnit acceptance tests
serenity.test.root=carturesti.features

# Customise your requirements hierarchy
#serenity.requirement.types=feature, story

# Run the tests without calling webdriver - useful to check your JUnit wiring
#serenity.dry.run=true

# Customise browser size
serenity.browser.height = 900
serenity.browser.width = 1600
